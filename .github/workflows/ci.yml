name: ci
on: [push, pull_request]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          uv venv
          # Pinned deliberately. An unpinned `ruff` turned CI red on untouched
          # files when 0.16.x widened its default rule set. ruff.toml now
          # declares `select` explicitly so that can't happen again, but a
          # pinned linter also keeps a given commit's CI result reproducible.
          # Bump this on purpose, in its own commit.
          uv pip install 'ruff==0.16.2' pytest
          sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Ruff lint (hooks)
        run: uv run ruff check hooks

      - name: Shellcheck (errors only — style nits are fine in hook scripts)
        run: shellcheck -S error hooks/*.sh

      - name: Hook syntax (python + bash)
        run: make syntax

      - name: Validate JSON files
        run: |
          for f in $(git ls-files '*.json'); do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" && echo "ok $f"
          done

      - name: Pytest
        run: uv run pytest -q
