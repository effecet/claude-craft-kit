name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Mondays 06:00 UTC: keeps the badge honest against dependency drift
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          uv venv
          # Pinned deliberately. An unpinned `ruff` turned CI red on untouched
          # files when 0.16.x widened its default rule set. ruff.toml now
          # declares `select` explicitly so that can't happen again, but a
          # pinned linter also keeps a given commit's CI result reproducible.
          # Bump this on purpose, in its own commit.
          uv pip install 'ruff==0.17.3' pytest
          sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install gitleaks (the git-hooks/dispatch tests need it)
        run: |
          set -e
          VER=8.30.1
          SHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          TGZ="gitleaks_${VER}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$TGZ" "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/${TGZ}"
          echo "$SHA  $RUNNER_TEMP/$TGZ" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$TGZ" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      - name: Ruff lint (hooks)
        run: uv run ruff check hooks

      - name: Shellcheck (errors only — style nits are fine in hook scripts)
        run: shellcheck -S error hooks/*.sh git-hooks/dispatch

      - name: Hook syntax (python + bash)
        run: make syntax

      - name: Validate JSON files
        run: |
          for f in $(git ls-files '*.json'); do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" && echo "ok $f"
          done

      - name: Pytest
        run: uv run pytest -q
